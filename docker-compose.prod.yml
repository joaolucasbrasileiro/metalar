services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache

  nginx:
    build:
      context: .
      target: nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - app

  queue:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache

  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    command: php artisan schedule:work
    volumes:
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache

volumes:
  bootstrap_cache:
  storage_data:
